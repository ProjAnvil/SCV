plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'fr.inria.gforge.spoon:spoon-core:11.5.0'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'projanvil.scv.beanprobe.BeanProbe'
}

test {
    useJUnitPlatform()
    dependsOn 'installDist'
    testLogging { events 'failed', 'skipped' }
}

tasks.named('run') {
    // usage: gradle run --args="<maven|gradle|noclasspath> <projectDir> <outJson>"
    if (project.hasProperty('args')) {
        args project.property('args').toString().split(' ') as List
    }
}
